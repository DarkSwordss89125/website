{% extends 'base.html' %}

{% block content %}
    <h2>Добавить статью</h2>
    <form method="post" enctype="multipart/form-data" style="background: white; padding: 20px; border-radius: 8px; border: 1px solid #d2b48c;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #8b1c3e; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; cursor: pointer;">Опубликовать</button>
    </form>
{% endblock %}
