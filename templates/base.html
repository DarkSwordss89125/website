<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мамина кухня</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Georgia', serif; background-color: #fdf5e6; color: #4a4a4a; margin: 0; padding: 0; }
        .header { background-color: #8b1c3e; color: white; text-align: center; padding: 20px 0; border-radius: 5px; margin: 15px; }
        .logo-link { display: inline-block; text-decoration: none; }
        .logo-img { height: 80px; border-radius: 5px; }
        .header p { margin: 10px 0 0 0; font-style: italic; font-size: 14px; }
        .nav { text-align: center; margin: 20px 0; font-size: 16px; }
        .nav a { color: #8b1c3e; text-decoration: none; font-weight: bold; }
        .nav a:hover { text-decoration: underline; }
        .nav span { color: #aaa; margin: 0 10px; }
        .content { max-width: 800px; margin: 0 auto; padding: 0 20px 40px 20px; }
        h2 { color: #8b1c3e; border-bottom: 1px dashed #d2b48c; padding-bottom: 5px; }
        .highlight { color: #b8860b; font-weight: bold; }
        ul { line-height: 1.6; }
        .img-container { text-align: center; margin: 20px 0; }
        .img-container img { max-width: 100%; border-radius: 10px; border: 2px solid #d2b48c; }
        .link-list { list-style-type: none; padding: 0; }
        .link-list li { margin-bottom: 15px; border-left: 4px solid #8b1c3e; padding-left: 10px; }
        .link-list a { color: #8b1c3e; font-weight: bold; text-decoration: none; }
        .link-list a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header class="header">
        <a href="{% url 'index' %}" class="logo-link">
            {% load static %}
            <img src="{% static 'images/MAMINA.jpg' %}" alt="Логотип" class="logo-img">
        </a>
        <p>Домашняя еда, которая согревает</p>
    </header>

    <nav class="nav">
        <a href="{% url 'index' %}">Главная</a>
        <span>|</span>
        <a href="{% url 'blog' %}">Блог</a>
        <span>|</span>
        <a href="{% url 'video' %}">Видео</a>
        <span>|</span>
        <a href="{% url 'links' %}">Рецепты и ссылки</a>
        <span>|</span>
        <a href="{% url 'feedback' %}">Обратная связь</a>
        <span>|</span>
        
        {% if user.is_authenticated %}
            <a href="{% url 'add_post' %}">Добавить статью</a>
            <span>|</span>
            <span style="color: #4a4a4a;">Привет, {{ user.username }}!</span>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" style="background:none; border:none; color:#8b1c3e; font-weight:bold; cursor:pointer; font-family:'Georgia', serif; font-size:16px;">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Вход</a>
            <span>|</span>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
